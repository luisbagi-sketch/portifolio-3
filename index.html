<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Card de NFT — Equilibrium</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/card.css">
  <link rel="stylesheet" href="css/card-hover.css">
</head>
<body id="top">
  <main class="page-center">
    <article class="card" id="nft-01">
      <a class="card__media" href="#nft-01" aria-label="Ver Equilibrium #3429">
        <img src="images/nft-01.jpg" alt="Arte do NFT Equilibrium #3429" width="600" height="600">
        <span class="card__overlay"><svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1.5 12S5.5 4.5 12 4.5 22.5 12 22.5 12 18.5 19.5 12 19.5 1.5 12 1.5 12Z"/><circle cx="12" cy="12" r="3.2"/></svg></span>
      </a>
      <h2 class="card__title"><a href="#nft-01">Equilibrium #3429</a></h2>
      <p class="card__text">Nossa coleção Equilibrium promove equilíbrio e calma.</p>
      <div class="card__stats">
        <p class="card__price"><svg width="11" height="18" viewBox="0 0 11 18" aria-hidden="true"><path fill="#00FFF8" d="M5.5 0 0 9.2l5.5 3.2L11 9.2 5.5 0Zm0 13.6L0 10.4 5.5 18 11 10.4l-5.5 3.2Z"/></svg><span>0,041 ETH</span></p>
        <p class="card__time"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="#8BAAD9" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><circle cx="8" cy="8" r="7"/><path d="M8 4v4.2l2.8 1.6"/></svg><span>3 dias restantes</span></p>
      </div>
      <div class="card__creator">
        <img class="card__avatar" src="images/avatar-1.png" alt="" width="66" height="66">
        <p>Criação de <a href="#nft-01">Jules Wyvern</a></p>
      </div>
    </article>
  </main>
  <footer class="attribution">
    Desafio do <a href="https://www.frontendmentor.io?ref=challenge" target="_blank" rel="noopener">Frontend Mentor</a>
  </footer>
</body>
</html>
